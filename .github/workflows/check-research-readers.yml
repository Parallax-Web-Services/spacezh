name: Research publication integrity

on:
  push:
    paths:
      - "research/**"
      - "public/research/**"
      - "data/evidence/**"
      - "docs/evidence/**"
      - "public/index.html"
      - "public/assets/evidence-brief.css"
      - "scripts/check_evidence_brief.py"
      - "public/assets/research-reader.css"
      - "scripts/check_research_publication.py"
      - ".github/workflows/check-research-readers.yml"
  pull_request:
    paths:
      - "research/**"
      - "public/research/**"
      - "data/evidence/**"
      - "docs/evidence/**"
      - "public/index.html"
      - "public/assets/evidence-brief.css"
      - "scripts/check_evidence_brief.py"
      - "public/assets/research-reader.css"
      - "scripts/check_research_publication.py"
      - ".github/workflows/check-research-readers.yml"

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify on-site readers and canonical Markdown
        run: python3 scripts/check_research_publication.py
      - name: Verify featured evidence brief and source register
        run: python3 scripts/check_evidence_brief.py
